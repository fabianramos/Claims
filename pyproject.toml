[project]
name = "claims-agg"
version = "0.1.0"
description = "Aggregates open class action settlements from several listing sites and ranks them by payout."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
claims-agg = "claims_agg.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claims_agg*"]

[tool.setuptools.package-data]
claims_agg = ["template.html"]
